name: Release

"on":
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.0"
          python-version: "3.10"
      - run: npm ci
      - name: Verify tag and manifest version
        shell: pwsh
        run: |
          $manifest = Get-Content package.json -Raw | ConvertFrom-Json
          $expected = "v$($manifest.version)"
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "Tag must equal $expected"
          }
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - name: Verify the audited VSIX directly
        run: node scripts/verify-mcp-vsix.mjs dist/unity-debugger-pure-mcp-0.1.0.vsix
      - name: Verify the launcher artifacts directly
        run: uv run --project launcher --locked --python 3.10 python launcher/scripts/verify_artifacts.py dist/launcher
      - name: Upload audited PyPI distributions
        uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: |
            dist/launcher/unity_debugger_pure_mcp-0.1.0-py3-none-win_amd64.whl
            dist/launcher/unity_debugger_pure_mcp-0.1.0.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Write release checksums
        shell: pwsh
        run: |
          $artifacts = @(
            "dist/unity-debugger-pure-mcp-0.1.0.vsix",
            "dist/launcher/unity_debugger_pure_mcp-0.1.0-py3-none-win_amd64.whl",
            "dist/launcher/unity_debugger_pure_mcp-0.1.0.tar.gz"
          )
          foreach ($artifact in $artifacts) {
            $sidecar = "$artifact.sha256"
            $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact).Hash.ToLowerInvariant()
            "$digest  $(Split-Path -Leaf $artifact)" |
              Set-Content -LiteralPath $sidecar -Encoding ascii -NoNewline
          }
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            dist/unity-debugger-pure-mcp-0.1.0.vsix `
            dist/unity-debugger-pure-mcp-0.1.0.vsix.sha256 `
            dist/launcher/unity_debugger_pure_mcp-0.1.0-py3-none-win_amd64.whl `
            dist/launcher/unity_debugger_pure_mcp-0.1.0-py3-none-win_amd64.whl.sha256 `
            dist/launcher/unity_debugger_pure_mcp-0.1.0.tar.gz `
            dist/launcher/unity_debugger_pure_mcp-0.1.0.tar.gz.sha256 `
            --verify-tag `
            --generate-notes

  pypi-publish:
    name: Publish launcher to PyPI
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/unity-debugger-pure-mcp
    permissions:
      id-token: write
    steps:
      - name: Download audited PyPI distributions
        uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist
      - name: Publish launcher distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
