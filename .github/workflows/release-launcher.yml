name: Release Launcher

"on":
  push:
    tags:
      - "launcher-v*"

jobs:
  build-launcher:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.0"
          python-version: "3.10"
      - run: npm ci
      - name: Verify launcher tag and project version
        id: version
        shell: pwsh
        run: |
          $version = (& uv version --project launcher --short).Trim()
          $expected = "launcher-v$version"
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "Tag must equal $expected"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: npm run typecheck
      - run: npm test
      - run: npm run package:launcher
      - run: npm run test:package:launcher
      - name: Write launcher checksums
        shell: pwsh
        run: |
          $artifacts = @(
            "dist/launcher/unity_debugger_pure_mcp-${{ steps.version.outputs.version }}-py3-none-win_amd64.whl",
            "dist/launcher/unity_debugger_pure_mcp-${{ steps.version.outputs.version }}.tar.gz"
          )
          foreach ($artifact in $artifacts) {
            $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact).Hash.ToLowerInvariant()
            "$digest  $(Split-Path -Leaf $artifact)" |
              Set-Content -LiteralPath "$artifact.sha256" -Encoding ascii -NoNewline
          }
      - name: Upload audited PyPI distributions
        uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: |
            dist/launcher/unity_debugger_pure_mcp-${{ steps.version.outputs.version }}-py3-none-win_amd64.whl
            dist/launcher/unity_debugger_pure_mcp-${{ steps.version.outputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Upload audited launcher release
        uses: actions/upload-artifact@v4
        with:
          name: launcher-release
          path: |
            dist/launcher/unity_debugger_pure_mcp-${{ steps.version.outputs.version }}-py3-none-win_amd64.whl
            dist/launcher/unity_debugger_pure_mcp-${{ steps.version.outputs.version }}-py3-none-win_amd64.whl.sha256
            dist/launcher/unity_debugger_pure_mcp-${{ steps.version.outputs.version }}.tar.gz
            dist/launcher/unity_debugger_pure_mcp-${{ steps.version.outputs.version }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  pypi-publish:
    runs-on: ubuntu-latest
    needs: build-launcher
    environment:
      name: pypi
      url: https://pypi.org/p/unity-debugger-pure-mcp
    permissions:
      id-token: write
    steps:
      - name: Download audited PyPI distributions
        uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist
      - name: Publish launcher distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  github-release:
    runs-on: ubuntu-latest
    needs: pypi-publish
    permissions:
      contents: write
    steps:
      - name: Download audited launcher release
        uses: actions/download-artifact@v4
        with:
          name: launcher-release
          path: dist
      - name: Create launcher GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            dist/*.whl \
            dist/*.whl.sha256 \
            dist/*.tar.gz \
            dist/*.tar.gz.sha256 \
            --verify-tag \
            --generate-notes
